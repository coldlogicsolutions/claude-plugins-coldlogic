name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      # `claude plugin validate --strict` on both manifests, except for the
      # deliberately missing plugin version. See the script.
      - run: scripts/validate.sh
